services:
  junocashd:
    image: juno-exchange-gateway/junocashd:0.9.12
    build:
      context: .
      dockerfile: docker/junocashd/Dockerfile
      args:
        JUNOCASH_VERSION: ${JUNOCASH_VERSION:-0.9.12}
        JUNOCASH_LINUX64_SHA256: ${JUNOCASH_LINUX64_SHA256:-41f74d61feb9a4284a4200b1fc163ecd072da3314a25db7222522f2e548ec386}

  juno-scan:
    image: juno-exchange-gateway/juno-scan:dev
    build:
      context: ../juno-scan
      dockerfile: Dockerfile

  gateway:
    image: juno-exchange-gateway/gateway:dev
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
      args:
        JUNO_ADDRGEN_REF: ${JUNO_ADDRGEN_REF:-4a2b3a361c7c1cc3e15891b0befb2eb3dfddb834}
        JUNO_TXBUILD_REPO: ${JUNO_TXBUILD_REPO:-https://github.com/junocash-tools/juno-txbuild.git}
        JUNO_TXBUILD_REF: ${JUNO_TXBUILD_REF:-05fb761c92ccb9a5da1cafec1e56c3cdca7ca20a}
        VERSION: ${JUNO_GATEWAY_VERSION:-dev}
        REVISION: ${JUNO_GATEWAY_REVISION:-local}
        BUILD_TIME: ${JUNO_GATEWAY_BUILD_TIME:-}
        COMPONENTS_JSON: >-
          {"juno-addrgen":"${JUNO_ADDRGEN_REF:-4a2b3a361c7c1cc3e15891b0befb2eb3dfddb834}","juno-scan":"${JUNO_SCAN_REF:-3f6009fe16d15faa0da5a8962e0f5dad30307135}","juno-txbuild":"${JUNO_TXBUILD_REF:-05fb761c92ccb9a5da1cafec1e56c3cdca7ca20a}","juno-txsign":"${JUNO_TXSIGN_REF:-121ef749383e27fb82c302e96cd55b70611817fc}","junocashd":"v${JUNOCASH_VERSION:-0.9.12}"}

  txbuild:
    image: juno-exchange-gateway/txbuild:dev
    build:
      context: .
      dockerfile: docker/txbuild/Dockerfile
      args:
        JUNO_TXBUILD_REPO: ${JUNO_TXBUILD_REPO:-https://github.com/junocash-tools/juno-txbuild.git}
        JUNO_TXBUILD_REF: ${JUNO_TXBUILD_REF:-05fb761c92ccb9a5da1cafec1e56c3cdca7ca20a}

  txsign:
    profiles: ["automation"]
    image: juno-exchange-gateway/txsign:dev
    build:
      context: .
      dockerfile: docker/txsign/Dockerfile
      args:
        JUNO_TXSIGN_REPO: ${JUNO_TXSIGN_REPO:-https://github.com/junocash-tools/juno-txsign.git}
        JUNO_TXSIGN_REF: ${JUNO_TXSIGN_REF:-121ef749383e27fb82c302e96cd55b70611817fc}
