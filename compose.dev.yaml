services:
  junocashd:
    image: juno-exchange-gateway/junocashd:0.9.13
    build:
      context: .
      dockerfile: docker/junocashd/Dockerfile
      args:
        JUNOCASH_VERSION: ${JUNOCASH_VERSION:-0.9.13}
        JUNOCASH_LINUX64_SHA256: ${JUNOCASH_LINUX64_SHA256:-7e83b8c888344f33129ece2160d8b6434bc91ffb9cd992665aadd2c02c904f11}

  juno-scan:
    image: juno-exchange-gateway/juno-scan:dev
    build:
      context: ../juno-scan
      dockerfile: Dockerfile

  gateway:
    image: juno-exchange-gateway/gateway:dev
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
      args:
        JUNO_ADDRGEN_REF: ${JUNO_ADDRGEN_REF:-4a2b3a361c7c1cc3e15891b0befb2eb3dfddb834}
        JUNO_TXBUILD_REPO: ${JUNO_TXBUILD_REPO:-https://github.com/junocash-tools/juno-txbuild.git}
        JUNO_TXBUILD_REF: ${JUNO_TXBUILD_REF:-553a977038c7f0660fc361acc059df80ce3101f3}
        VERSION: ${JUNO_GATEWAY_VERSION:-dev}
        REVISION: ${JUNO_GATEWAY_REVISION:-local}
        BUILD_TIME: ${JUNO_GATEWAY_BUILD_TIME:-}
        COMPONENTS_JSON: >-
          {"juno-addrgen":"${JUNO_ADDRGEN_REF:-4a2b3a361c7c1cc3e15891b0befb2eb3dfddb834}","juno-scan":"${JUNO_SCAN_REF:-fcd02df03cf09b482f95be070b8fa9894d5c0222}","juno-txbuild":"${JUNO_TXBUILD_REF:-553a977038c7f0660fc361acc059df80ce3101f3}","juno-txsign":"${JUNO_TXSIGN_REF:-d33f925dc73ee929ac95073fdcd40a4f17dbb43d}","junocashd":"v${JUNOCASH_VERSION:-0.9.13}"}

  txbuild:
    image: juno-exchange-gateway/txbuild:dev
    build:
      context: .
      dockerfile: docker/txbuild/Dockerfile
      args:
        JUNO_TXBUILD_REPO: ${JUNO_TXBUILD_REPO:-https://github.com/junocash-tools/juno-txbuild.git}
        JUNO_TXBUILD_REF: ${JUNO_TXBUILD_REF:-553a977038c7f0660fc361acc059df80ce3101f3}

  txsign:
    profiles: ["automation"]
    image: juno-exchange-gateway/txsign:dev
    build:
      context: .
      dockerfile: docker/txsign/Dockerfile
      args:
        JUNO_TXSIGN_REPO: ${JUNO_TXSIGN_REPO:-https://github.com/junocash-tools/juno-txsign.git}
        JUNO_TXSIGN_REF: ${JUNO_TXSIGN_REF:-d33f925dc73ee929ac95073fdcd40a4f17dbb43d}
