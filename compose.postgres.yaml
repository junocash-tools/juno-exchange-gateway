services:
  postgres:
    image: ${JUNO_POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777}
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      POSTGRES_DB: ${JUNO_POSTGRES_DB:-junoscan}
      POSTGRES_USER: ${JUNO_POSTGRES_USER:-junoscan}
      POSTGRES_PASSWORD: ${JUNO_POSTGRES_PASSWORD:?JUNO_POSTGRES_PASSWORD is required for Postgres mode}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - storage
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  juno-scan:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JUNO_SCAN_DB_DRIVER: postgres
      JUNO_SCAN_DB_PATH: ""
      JUNO_SCAN_DB_DSN: host=postgres
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${JUNO_POSTGRES_DB:-junoscan}
      PGUSER: ${JUNO_POSTGRES_USER:-junoscan}
      PGPASSWORD: ${JUNO_POSTGRES_PASSWORD:?JUNO_POSTGRES_PASSWORD is required for Postgres mode}
      PGSSLMODE: disable

volumes:
  postgres-data: {}
